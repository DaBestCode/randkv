[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "randkv"
version = "0.1.0"
description = "Deterministic, prompt-protected random KV-cache eviction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "RandKV contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
transformers = [
  "torch>=2.6",
  "transformers>=5.16,<5.17",
]
test = [
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.urls]
Repository = "https://github.com/DaBestCode/randkv"
Issues = "https://github.com/DaBestCode/randkv/issues"
Paper = "https://arxiv.org/abs/2609.03430"
Reference = "https://github.com/SalesforceAIResearch/Random-Attention"

[tool.hatch.build.targets.wheel]
packages = ["src/randkv"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
